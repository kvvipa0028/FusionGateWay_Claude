      description: 完整 TaskVersion 在 Store 事务内 CAS。body 只能是 {}，不接受 owner、StopProof、账号、workspace、Native session 或 flags。旧条件为412；重试需先读 Task，当前同状态操作不重复事件。 整项任务取消意图可能已提交但实际停止尚未确认；409
        可以携带安全 receipt，不能丢弃已有意图。
      x-fusion-cancellation: 终止整项任务的派单；不回滚文件、不退款、不恢复未知执行。与 /runs/{run_id}/cancel 阶段取消不同。
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 单个 strong Task ETag，例如 "p1-g0-ready"；不是 plan revision tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyRequest'
      responses:
        '200':
          description: 当前 Task、安全可选 Run、是否提交变更；无私有 owner/session/原始输出。
          headers:
            X-Fusion-Task-ETag:
              schema:
                type: string
                pattern: ^"p[1-9][0-9]*-g[0-9]+-[a-z_]+"$
