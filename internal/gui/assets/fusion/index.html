<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fusion Gateway · 阶段模型配置</title><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./editor.css"></head>
<body class="web fusion-stage">
<header class="top"><div class="brand"><span>Magpie · Fusion</span></div><nav class="seg" id="nav" aria-label="当前页面"><button class="on" aria-current="page" type="button">阶段模型配置</button></nav></header>
<main class="view" id="view-fusion">
<div class="toolbar profiles">
<label>项目<select id="project" aria-label="项目"></select></label>
<label>配置范围<select id="scope" aria-label="配置范围"><option value="project">项目配置</option><option value="global">全局默认</option><option value="task">本次任务</option></select></label>
<button id="reload" class="text action">重新载入</button>
</div>
<p class="priority">本次任务 ＞ 项目配置 ＞ 全局默认。继承使用较低层的完整选择。</p>
<div class="presets profiles"><label>预设<select id="preset" aria-label="预设"><option value="">不载入预设</option></select></label><label>明确版本<input id="preset-version" aria-label="预设版本" inputmode="numeric"></label><button id="apply-preset" class="text action">载入此版本</button><span id="preset-source"></span></div>
<div class="preset-save profiles"><label>预设名称<input id="preset-name" aria-label="预设名称"></label><button id="create-preset" class="text action">保存为新预设</button><button id="save-preset" class="text action">保存预设新版本</button><button id="retry-preset" class="text action" hidden>重试同一预设保存</button><p id="preset-editing">保存当前范围的五角色选择；不会改写默认配置或启动模型。</p></div>
<div id="groups"></div>
<section id="task" class="list" hidden><h2>单阶段任务预览</h2><label>任务目标<textarea id="goal" aria-label="任务目标" rows="3"></textarea></label><label>本次阶段<select id="task-role" aria-label="本次阶段"></select></label><p>预览核对服务端模型绑定，不启动任务。</p></section>
<footer><button id="save" class="text primary" disabled>保存项目配置</button><p id="status" role="status" aria-live="polite">正在读取本机配置…</p></footer>
<section id="preview" class="list" hidden aria-label="计划预览"></section>
<div id="task-submit" class="task-submit" hidden><p>提交固化此预览，不启动阶段。</p><button id="submit-task" class="text primary">冻结提交任务</button><button id="retry-task" class="text action" hidden>重试同一任务提交</button></div>
<section id="task-workbench" class="list" aria-label="任务工作台"><div class="row"><h2 class="name">已保存任务</h2><button id="refresh-tasks" class="text action">刷新任务列表</button><button id="older-tasks" class="text action" hidden>读取更早任务</button></div><div id="task-list"></div><p id="task-list-status" class="task-record" role="status" aria-live="polite">正在读取任务列表…</p></section>
<section class="list task-record-panel" aria-label="任务详情"><div class="row"><h2 class="name">任务详情</h2><button id="reload-task" class="text action" disabled>重新读取任务</button></div><div id="task-detail" class="task-record"></div><p id="task-detail-status" class="task-record" role="status" aria-live="polite">选择任务读取完整目标、冻结计划和预算。</p></section>
</main>
<script type="module" src="./editor.mjs"></script>
</body></html>
