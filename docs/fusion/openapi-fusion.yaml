                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 固定错误码，不回显异常/输入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 固定错误码，不回显异常/输入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 固定错误码，不回显异常/输入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ManagementBearer:
      type: http
      scheme: bearer
      description: 仅服务端管理凭据。stage fgs_ identity 被拒绝；禁止通过 query/body 提供凭据。
  schemas:
    PresetSelection:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
    PresetRef:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - hash
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
    PresetInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          x-fusion-max-utf8-bytes: 256
        layer:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
    Preset:
      type: object
      additionalProperties: false
      required:
      - project_id
      - id
      - revision
      - name
      - layer
      - hash
      - created_at
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 256
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
        name:
          type: string
        layer:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        created_at:
          type: string
          format: date-time
    PresetReceipt:
      type: object
      additionalProperties: false
      required:
      - preset
      - created
      properties:
        preset:
          $ref: '#/components/schemas/Preset'
        created:
          type: boolean
    PresetList:
      type: object
      additionalProperties: false
      required:
      - presets
      properties:
        presets:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Preset'
    TaskPresetReply:
      type: object
      additionalProperties: false
      required:
      - preset
      properties:
        preset:
          oneOf:
          - $ref: '#/components/schemas/PresetRef'
          - type: 'null'
    BudgetLimits:
      type: object
      additionalProperties: false
      required:
      - max_calls
      - max_reworks
      properties:
        max_calls:
          type: integer
          minimum: 1
          maximum: 1000
        max_reworks:
          type: integer
          minimum: 0
          maximum: 1
    ProjectConfigurationReply:
      type: object
      additionalProperties: false
      required:
      - revision
      - configuration
      properties:
        revision:
          type: integer
          minimum: 1
        configuration:
          type: object
          additionalProperties: false
          required:
          - global
          - project
          - routes
          properties:
            global:
              $ref: ./contracts/stage-plan.schema.json#/$defs/layer
            project:
              $ref: ./contracts/stage-plan.schema.json#/$defs/layer
            routes:
              type: array
              maxItems: 256
              readOnly: true
              items:
                type: object
                description: 可信 route 元数据；完整字段合同后续补入
            default_budget:
              $ref: '#/components/schemas/BudgetLimits'
    PreviewRequest:
      type: object
      additionalProperties: false
      required:
      - project_id
      - goal
      - required_roles
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 256
        goal:
          type: string
          minLength: 1
          x-fusion-max-utf8-bytes: 65536
        required_roles:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
        task:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
        budget:
          $ref: '#/components/schemas/BudgetLimits'
        preset:
          $ref: '#/components/schemas/PresetSelection'
    Preview:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - configuration_revision
      - expires_at
      - plan
      - budget
      properties:
        preview_id:
          type: string
          minLength: 1
          maxLength: 256
        configuration_revision:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        plan:
          type: object
          description: 冻结 stageplan Snapshot；完整字段合同后续补入
        budget:
          $ref: '#/components/schemas/BudgetLimits'
        preset:
          $ref: '#/components/schemas/PresetRef'
    QuotaStatus:
      type: string
      enum: [available, zero, unknown, stale, unverified, auth_required, unsupported]
    RouteQuota:
      type: object
      additionalProperties: false
      required: [route, status]
      properties:
        route:
          type: object
          additionalProperties: false
          required: [id, revision]
          properties:
            id: {type: string}
            revision: {type: integer, minimum: 1}
        identity:
          type: object
          description: 精确 quota Identity；完整字段见 quota-snapshot.schema.json。
        status:
          $ref: '#/components/schemas/QuotaStatus'
        snapshot:
          type: object
          description: quota Snapshot；原始来源时间、窗口、单位与值保留，完整字段见 quota-snapshot.schema.json。
        error:
          $ref: '#/components/schemas/ControlError'
    QuotaReply:
      type: object
      additionalProperties: false
      required: [configuration_revision, routes, pools]
      properties:
        configuration_revision: {type: integer, minimum: 1}
        routes:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/RouteQuota'
        pools:
          type: array
          maxItems: 256
          items:
            type: object
            description: GroupPools 的 pool/aliases/snapshot；不累加 alias 配额。
    Role:
      type: string
      enum:
      - design
      - implementation
      - testing
      - review
      - acceptance
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - goal
      - state
      - plan_revision
      - generation
      properties:
        id:
          type: string
        project_id:
          type: string
        goal:
          type: string
        state:
          type: string
        plan_revision:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 0
    RunView:
      type: object
      additionalProperties: false
      required:
      - id
      - task_id
      - role
      - attempt
      - generation
      - plan_revision
      - state
      - startup_intent
      - launch_confirmed
      - target
      properties:
        id:
          type: string
        task_id:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        attempt:
          type: integer
          minimum: 1
        generation:
          type: integer
          minimum: 0
        plan_revision:
          type: integer
          minimum: 1
        state:
          type: string
        startup_intent:
          type: boolean
        launch_confirmed:
          type: boolean
        target:
          type: object
          description: 冻结 ExecutionTarget；完整字段合同后续补入
    ControlError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ControlError'
    ExecutionReply:
      type: object
      additionalProperties: false
      required:
      - run
      - created
      properties:
        run:
          $ref: '#/components/schemas/RunView'
        created:
          type: boolean
        error:
          $ref: '#/components/schemas/ControlError'
