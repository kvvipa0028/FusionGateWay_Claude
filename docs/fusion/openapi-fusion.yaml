          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          headers:
            ETag:
              schema:
                type: string
              description: 当前读取资源的 strong revision 或 Task 状态 tag，见对应资源说明。
            X-Fusion-Task-ETag:
              schema:
                type: string
                pattern: ^"p[1-9][0-9]*-g[0-9]+-[a-z_]+"$
              description: 相关 Task 当前条件，不是 RunView 本身的 ETag。
            Location:
              schema:
                type: string
