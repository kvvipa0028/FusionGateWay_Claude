openapi: 3.1.0
info:
  title: Fusion task control API
  version: 0.1.0-draft
  description: 已实现 execution/quota/preset/preview Handler 接口草案。未注册产品 listener。完整 WP-15 的其他接口仍待补全。
x-fusion-status: draft-partial
x-fusion-production-registered: false
security:
- ManagementBearer: []
paths:
