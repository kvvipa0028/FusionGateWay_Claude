        in: header
        required: true
        description: 原启动请求的完整 ready Task 条件；任务变化不改用当前条件。
        schema:
          type: string
          pattern: '^"p[1-9][0-9]*-g(0|[1-9][0-9]*)-ready"$'
      - name: Idempotency-Key
        in: header
        required: true
        description: 原请求唯一 key；GET 同样传递，不是凭据。
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '200':
          description: 原始冻结记录；确认仅匹配原 run，封存仅适用于尚未写入运行的请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartRequestRecordReply'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
