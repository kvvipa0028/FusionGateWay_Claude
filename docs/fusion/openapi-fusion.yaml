  /control/v1/tasks/{task_id}/start:
    post:
      operationId: startStage
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - &id013
        name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 单个 strong Task ETag，例如 "p1-g0-ready"；不是 plan revision tag
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: 保存原始角色与条件，重试不启动新进程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - role
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200': &id001
          description: 安全 RunView；X-Fusion-Task-ETag 指向相关 Task 的当前条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionReply'
        '202': *id001
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '405': *id006
        '409':
          description: 冲突/需对账；已经提交的失败 intent 包含 RunView/Created
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ExecutionReply'
        '412': *id007
        '428': *id008
        '429': *id009
        '500': *id010
        '503': *id011
