components:
  securitySchemes:
    ManagementBearer:
      type: http
      scheme: bearer
      description: 仅服务端管理凭据。stage fgs_ identity 被拒绝；禁止通过 query/body 提供凭据。
  schemas:
    PresetSelection:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
    PresetRef:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - hash
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
    PresetInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          x-fusion-max-utf8-bytes: 256
        layer:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
          description: 省略等价空层，保存五角色 inherit；保存不授予 execution admission。
    Preset:
      type: object
      additionalProperties: false
      required:
      - project_id
      - id
      - revision
      - name
      - layer
      - hash
      - created_at
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 256
        id:
          type: string
          minLength: 1
          maxLength: 256
        revision:
          type: integer
          minimum: 1
        name:
          type: string
        layer:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
        hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        created_at:
          type: string
          format: date-time
    PresetReceipt:
      type: object
      additionalProperties: false
      required:
      - preset
      - created
      properties:
        preset:
          $ref: '#/components/schemas/Preset'
        created:
          type: boolean
    PresetList:
      type: object
      additionalProperties: false
      required:
      - presets
      properties:
        presets:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/Preset'
    TaskPresetReply:
      type: object
      additionalProperties: false
      required:
      - preset
      properties:
        preset:
          oneOf:
          - $ref: '#/components/schemas/PresetRef'
          - type: 'null'
    BudgetLimits:
      type: object
      additionalProperties: false
      required:
      - max_calls
      - max_reworks
      properties:
        max_calls:
          type: integer
          minimum: 1
          maximum: 1000
        max_reworks:
          type: integer
          minimum: 0
          maximum: 1
    ProjectsReply:
      type: object
      additionalProperties: false
      required:
      - projects
      properties:
        projects:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ProjectReference'
    ProjectReference:
      type: object
      additionalProperties: false
      required:
      - id
      - configuration_revision
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        configuration_revision:
          type: integer
          minimum: 1
    ProjectConfigurationReply:
      type: object
      additionalProperties: false
      required:
      - revision
      - configuration
      properties:
        revision:
          type: integer
          minimum: 1
        configuration:
          type: object
          additionalProperties: false
          required:
          - global
          - project
          - routes
          properties:
            global:
              $ref: ./contracts/stage-plan.schema.json#/$defs/layer
            project:
              $ref: ./contracts/stage-plan.schema.json#/$defs/layer
            routes:
              type:
              - array
              - 'null'
              items:
                $ref: '#/components/schemas/RegistryRoute'
              maxItems: 256
            default_budget:
              $ref: '#/components/schemas/BudgetLimits'
    PreviewRequest:
      type: object
      additionalProperties: false
      required:
      - project_id
      - goal
      - required_roles
      properties:
        project_id:
          type: string
          minLength: 1
          maxLength: 256
        goal:
          type: string
          minLength: 1
          x-fusion-max-utf8-bytes: 65536
        required_roles:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
        task:
          $ref: ./contracts/stage-plan.schema.json#/$defs/layer
        budget:
          $ref: '#/components/schemas/BudgetLimits'
        preset:
          $ref: '#/components/schemas/PresetSelection'
    Preview:
      type: object
      additionalProperties: false
      required:
      - preview_id
      - configuration_revision
      - expires_at
      - plan
      - budget
      properties:
        preview_id:
          type: string
          minLength: 1
          maxLength: 256
        configuration_revision:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        plan:
          $ref: '#/components/schemas/Snapshot'
        budget:
          $ref: '#/components/schemas/BudgetLimits'
        preset:
          $ref: '#/components/schemas/PresetRef'
    QuotaStatus:
      type: string
      enum:
      - available
      - zero
      - unknown
      - stale
      - unverified
      - auth_required
      - unsupported
    RouteQuota:
      type: object
      additionalProperties: false
      required:
      - route
      - status
      properties:
        route:
          $ref: '#/components/schemas/RouteRef'
        identity:
          $ref: '#/components/schemas/QuotaIdentity'
        status:
          $ref: '#/components/schemas/QuotaStatus'
        snapshot:
          $ref: '#/components/schemas/QuotaSnapshot'
        error:
          $ref: '#/components/schemas/ControlError'
    QuotaReply:
      type: object
      additionalProperties: false
      required:
      - configuration_revision
      - routes
      - pools
      properties:
        configuration_revision:
          type: integer
          minimum: 1
        routes:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/RouteQuota'
        pools:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/PoolView'
    Role:
      type: string
      enum:
      - design
      - implementation
      - testing
      - review
      - acceptance
    TaskListEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - project_id
      - goal
      - state
      - plan_revision
      - generation
